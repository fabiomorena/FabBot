name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt', 'requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # Phase 244 (#371): chromadb nur fuer die Integrationstests, bewusst NICHT in
      # requirements-ci.txt. Dort wuerde pip-audit dessen 5 Funde ohne Fix-Version sehen
      # (nur Server-API betroffen, FabBot nutzt PersistentClient; dismissed am 10.10.) und
      # wir braeuchten ignore-vuln-Eintraege, die kuenftig auch eine behebbare chromadb-CVE
      # verschlucken. Version aus requirements.txt gelesen, damit sie nicht driften kann.
      - name: Install chromadb (integration tests only)
        run: |
          pin=$(grep -E '^chromadb==' requirements.txt)
          test -n "$pin" || { echo "chromadb-Pin in requirements.txt nicht gefunden"; exit 1; }
          echo "Installiere $pin"
          pip install "$pin"

      - name: Security audit
        # torch CVEs (no fix version available upstream) and joblib PYSEC-2024-277 ignored
        run: |
          pip-audit -r requirements-ci.txt \
            --ignore-vuln PYSEC-2025-189 \
            --ignore-vuln PYSEC-2025-190 \
            --ignore-vuln PYSEC-2025-191 \
            --ignore-vuln PYSEC-2025-192 \
            --ignore-vuln PYSEC-2025-193 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2025-196 \
            --ignore-vuln PYSEC-2025-197 \
            --ignore-vuln PYSEC-2025-210 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln PYSEC-2024-277

      - name: Static security scan
        run: bandit -r . --exclude ./.venv,./tests -lll -q

      - name: Run tests
        run: pytest tests/ -v
