repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff-format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [--config-file=pyproject.toml, agent, bot]

      - id: bandit
        name: bandit
        entry: .venv/bin/python -m bandit
        language: system
        types: [python]
        args: [-lll, -q, --exclude, .venv,tests]
        pass_filenames: false

      # .git/config ist nicht versioniert – daher always_run statt types/files.
      - id: no-token-in-remote
        name: Kein Token in der Git-Remote-URL
        entry: .venv/bin/python git_remote_guard.py
        language: system
        always_run: true
        pass_filenames: false
